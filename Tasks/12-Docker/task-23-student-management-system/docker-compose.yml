
services:
  frontend:
    build:
      context: ./frontend
    container_name: super30-task23-frontend
    ports:
      - "8023:80"
    depends_on:
      - api
    networks:
      - student-network
    restart: unless-stopped

  api:
    build:
      context: ./backend
    container_name: super30-task23-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - student-network
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: super30-task23-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - student-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - student-network
    restart: unless-stopped

volumes:
  student-data:

networks:
  student-network:
    driver: bridge
