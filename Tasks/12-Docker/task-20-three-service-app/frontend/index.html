<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super30 Docker App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 60px auto;
            padding: 20px;
            background: #f4f7fb;
            color: #1f2937;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 14px #00000012;
        }

        button {
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Super30 Docker Application</h1>
        <p>Frontend → FastAPI → PostgreSQL</p>
        <button onclick="checkBackend()">Check Backend & Database</button>
        <pre id="result">Click the button to test the connection.</pre>
    </div>

    <script>
        async function checkBackend() {
            const result = document.getElementById("result");
            result.textContent = "Checking connection...";

            try {
                const response = await fetch("/api/db-check");
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Request failed");
                }

                result.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                result.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
